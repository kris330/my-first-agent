<svg width="900" height="500" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- 主背景渐变 -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%"   stop-color="#080c18"/>
      <stop offset="60%"  stop-color="#10162a"/>
      <stop offset="100%" stop-color="#1a1040"/>
    </linearGradient>

    <!-- 右侧橙色光晕 -->
    <radialGradient id="glowOrange" cx="80%" cy="25%" r="50%">
      <stop offset="0%"   stop-color="#f97316" stop-opacity="0.18"/>
      <stop offset="100%" stop-color="#f97316" stop-opacity="0"/>
    </radialGradient>

    <!-- 左下蓝色光晕 -->
    <radialGradient id="glowBlue" cx="10%" cy="90%" r="40%">
      <stop offset="0%"   stop-color="#3b82f6" stop-opacity="0.12"/>
      <stop offset="100%" stop-color="#3b82f6" stop-opacity="0"/>
    </radialGradient>

    <!-- 网格纹理 -->
    <pattern id="grid" width="48" height="48" patternUnits="userSpaceOnUse">
      <path d="M 48 0 L 0 0 0 48" fill="none" stroke="rgba(255,255,255,0.035)" stroke-width="1"/>
    </pattern>

    <!-- 代码块裁切 -->
    <clipPath id="codeClip">
      <rect x="548" y="64" width="316" height="372" rx="12"/>
    </clipPath>
  </defs>

  <!-- === 背景层 === -->
  <rect width="900" height="500" fill="url(#bgGrad)"/>
  <rect width="900" height="500" fill="url(#grid)"/>
  <rect width="900" height="500" fill="url(#glowOrange)"/>
  <rect width="900" height="500" fill="url(#glowBlue)"/>

  <!-- === 右侧代码块 === -->
  <rect x="548" y="64" width="316" height="372" rx="12"
        fill="rgba(255,255,255,0.04)"
        stroke="rgba(255,255,255,0.09)" stroke-width="1"/>

  <!-- 代码块顶栏 -->
  <rect x="548" y="64" width="316" height="36" rx="12" fill="rgba(255,255,255,0.06)"/>
  <rect x="548" y="88"  width="316" height="12" fill="rgba(255,255,255,0.06)"/><!-- 补底角直线 -->
  <circle cx="572" cy="82" r="5" fill="#ff5f57" opacity="0.85"/>
  <circle cx="591" cy="82" r="5" fill="#febc2e" opacity="0.85"/>
  <circle cx="610" cy="82" r="5" fill="#28c840" opacity="0.85"/>
  <text x="648" y="87" font-family="'SF Mono','JetBrains Mono','Fira Code','Courier New',monospace"
        font-size="11" fill="rgba(255,255,255,0.25)">agent_faq.py</text>

  <!-- 代码内容 -->
  <!-- Q1 注释 -->
  <text x="568" y="123" font-family="'SF Mono','JetBrains Mono','Courier New',monospace"
        font-size="11.5" fill="#6272a4"># Q: JSON 提取可靠吗？</text>

  <text x="568" y="145" font-family="'SF Mono','JetBrains Mono','Courier New',monospace" font-size="11.5">
    <tspan fill="#8be9fd">def </tspan><tspan fill="#50fa7b">safe_parse_json</tspan><tspan fill="#f8f8f2">(text: </tspan><tspan fill="#8be9fd">str</tspan><tspan fill="#f8f8f2">):</tspan>
  </text>
  <text x="568" y="163" font-family="'SF Mono','JetBrains Mono','Courier New',monospace" font-size="11.5">
    <tspan fill="#f8f8f2" dx="18">try: </tspan><tspan fill="#8be9fd">return </tspan><tspan fill="#f8f8f2">json.loads(text)</tspan>
  </text>
  <text x="568" y="181" font-family="'SF Mono','JetBrains Mono','Courier New',monospace" font-size="11.5">
    <tspan fill="#f8f8f2" dx="18">match </tspan><tspan fill="#ff79c6">= </tspan><tspan fill="#f8f8f2">re.search(</tspan><tspan fill="#f1fa8c">r'\{.*\}'</tspan><tspan fill="#f8f8f2">, text)</tspan>
  </text>

  <!-- 分隔线 -->
  <line x1="568" y1="197" x2="844" y2="197" stroke="rgba(255,255,255,0.07)" stroke-width="1"/>

  <!-- Q2 注释 -->
  <text x="568" y="216" font-family="'SF Mono','JetBrains Mono','Courier New',monospace"
        font-size="11.5" fill="#6272a4"># Q: 约束解码更可靠？</text>

  <text x="568" y="234" font-family="'SF Mono','JetBrains Mono','Courier New',monospace" font-size="11.5">
    <tspan fill="#ff79c6">response_format </tspan><tspan fill="#f8f8f2">= {</tspan>
  </text>
  <text x="568" y="252" font-family="'SF Mono','JetBrains Mono','Courier New',monospace" font-size="11.5">
    <tspan fill="#f8f8f2" dx="18">"type": </tspan><tspan fill="#f1fa8c">"json_schema"</tspan><tspan fill="#f8f8f2">,</tspan>
  </text>
  <text x="568" y="270" font-family="'SF Mono','JetBrains Mono','Courier New',monospace" font-size="11.5">
    <tspan fill="#f8f8f2" dx="18">"json_schema": schema</tspan>
  </text>
  <text x="568" y="288" font-family="'SF Mono','JetBrains Mono','Courier New',monospace" font-size="11.5">
    <tspan fill="#f8f8f2">}</tspan>
  </text>

  <!-- 分隔线 -->
  <line x1="568" y1="303" x2="844" y2="303" stroke="rgba(255,255,255,0.07)" stroke-width="1"/>

  <!-- Q3 注释 -->
  <text x="568" y="322" font-family="'SF Mono','JetBrains Mono','Courier New',monospace"
        font-size="11.5" fill="#6272a4"># Q: 和 LangChain 有何关系？</text>

  <text x="568" y="340" font-family="'SF Mono','JetBrains Mono','Courier New',monospace" font-size="11.5">
    <tspan fill="#8be9fd">class </tspan><tspan fill="#50fa7b">Agent</tspan><tspan fill="#f8f8f2">:</tspan>
  </text>
  <text x="568" y="358" font-family="'SF Mono','JetBrains Mono','Courier New',monospace" font-size="11.5">
    <tspan fill="#f8f8f2" dx="18">tools  </tspan><tspan fill="#ff79c6">= </tspan><tspan fill="#f8f8f2">ToolRegistry()</tspan>
  </text>
  <text x="568" y="376" font-family="'SF Mono','JetBrains Mono','Courier New',monospace" font-size="11.5">
    <tspan fill="#f8f8f2" dx="18">memory </tspan><tspan fill="#ff79c6">= </tspan><tspan fill="#f8f8f2">ShortTermMemory()</tspan>
  </text>
  <text x="568" y="394" font-family="'SF Mono','JetBrains Mono','Courier New',monospace" font-size="11.5">
    <tspan fill="#f8f8f2" dx="18">loop   </tspan><tspan fill="#ff79c6">= </tspan><tspan fill="#f8f8f2">ReactLoop(</tspan><tspan fill="#bd93f9">max_steps</tspan><tspan fill="#f8f8f2">=</tspan><tspan fill="#bd93f9">5</tspan><tspan fill="#f8f8f2">)</tspan>
  </text>

  <!-- 光标 -->
  <rect x="568" y="406" width="7" height="13" rx="1" fill="#f97316" opacity="0.9">
    <animate attributeName="opacity" values="0.9;0.2;0.9" dur="1.2s" repeatCount="indefinite"/>
  </rect>

  <!-- === 左侧主内容 === -->

  <!-- 左侧橙色竖条 -->
  <rect x="60" y="128" width="4" height="218" rx="2" fill="#f97316" opacity="0.95"/>

  <!-- 小徽章 Q&A 番外篇 -->
  <rect x="76" y="126" width="138" height="30" rx="15"
        fill="rgba(249,115,22,0.12)"
        stroke="rgba(249,115,22,0.55)" stroke-width="1"/>
  <text x="145" y="146"
        font-family="'PingFang SC','Microsoft YaHei','Helvetica Neue',sans-serif"
        font-size="13" fill="#f97316" text-anchor="middle" letter-spacing="2">Q&amp;A  番外篇</text>

  <!-- 系列副标题 -->
  <text x="76" y="200"
        font-family="'PingFang SC','Microsoft YaHei','Helvetica Neue',sans-serif"
        font-size="17" fill="rgba(255,255,255,0.45)" letter-spacing="1">
    7天从零手搓 AI Agent
  </text>

  <!-- 主标题第一行 -->
  <text x="76" y="278"
        font-family="'PingFang SC','Microsoft YaHei','Helvetica Neue',sans-serif"
        font-size="66" font-weight="700" fill="white" letter-spacing="-2">
    读者常见问题
  </text>

  <!-- 主标题第二行（"解答"用橙色） -->
  <text x="76" y="348"
        font-family="'PingFang SC','Microsoft YaHei','Helvetica Neue',sans-serif"
        font-size="66" font-weight="700" letter-spacing="-2">
    <tspan fill="white">汇总</tspan><tspan fill="#f97316">解答</tspan>
  </text>

  <!-- 分割线 -->
  <line x1="76" y1="375" x2="508" y2="375" stroke="rgba(255,255,255,0.1)" stroke-width="1"/>

  <!-- 标签行 -->
  <text x="76" y="402"
        font-family="'PingFang SC','Microsoft YaHei',sans-serif"
        font-size="14" fill="rgba(255,255,255,0.35)" letter-spacing="2">
    环境配置  ·  代码运行  ·  理解扩展
  </text>

  <!-- 作者 -->
  <text x="76" y="452"
        font-family="'PingFang SC','Microsoft YaHei',sans-serif"
        font-size="15" fill="rgba(255,255,255,0.3)" letter-spacing="1">
    小撒的私房菜
  </text>

</svg>
